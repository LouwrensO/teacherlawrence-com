<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fix Let's Talk Questions — Teacher Lawrence</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%235b6ef0%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-family=%27Arial Black,Arial,sans-serif%27 font-size=%2734%27 font-weight=%27900%27 fill=%27%23fff%27 text-anchor=%27middle%27%3EE%3C/text%3E%3C/svg%3E">
<script src="pixel.js"></script>
<style>
  .twrap{max-width:640px;margin:60px auto;padding:0 20px;text-align:center;font-family:Helvetica,Arial,sans-serif;}
  .twrap h1{font-family:'Arial Black',sans-serif;font-size:26px;margin-bottom:10px;color:var(--ink);}
  #status{font-size:18px;font-weight:700;color:var(--ink);margin-top:18px;}
  #detail{color:var(--muted);font-size:14px;margin-top:10px;white-space:pre-wrap;text-align:left;background:var(--soft);border-radius:10px;padding:14px;max-height:300px;overflow:auto;}
</style>
</head>
<body>
  <div class="nav"><div class="nav-inner">
    <a class="brand" href="/"><span class="mark">T</span>Teacher Lawrence</a>
  </div></div>

  <!-- One-shot bulk fix: simplifies every existing lesson's discussion
       (Let's Talk) / practise (Let's Practise) questions that are still
       {q,options,correct} back down to plain open-ended question strings
       — see api/make.js's fixDiscussionChoicesAll() for why this is safe
       to run as one request instead of a one-lesson-per-call loop like
       upgrade-comprehension.html. Safe to re-run — a lesson with nothing
       left to fix is skipped automatically. -->
  <div class="twrap">
    <h1>🔧 Fixing Let's Talk questions…</h1>
    <p style="color:var(--muted)">This simplifies every lesson's Let's Talk / Let's Practise questions back to open-ended text, undoing any leftover multiple-choice ones. Runs once, in a single pass.</p>
    <div id="status">Working…</div>
    <div id="detail" style="display:none;"></div>
  </div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
if(!token){
  document.getElementById('status').textContent = 'Add your token: /fix-discussion-choices.html?token=YOUR_TOKEN';
} else {
  fetch('/api/make?fixDiscussionChoices=1&token=' + encodeURIComponent(token))
    .then(r => r.json())
    .then(j => {
      if(j.error){
        document.getElementById('status').textContent = '⚠️ ' + j.error;
        return;
      }
      document.getElementById('status').textContent = '✅ Done — fixed ' + j.count + ' lesson' + (j.count===1?'':'s') + (j.failed && j.failed.length ? (', ' + j.failed.length + ' failed') : '.');
      const d = document.getElementById('detail');
      d.style.display = 'block';
      d.textContent = 'Fixed:\n' + (j.fixed && j.fixed.length ? j.fixed.join('\n') : '(none needed it)') +
        (j.failed && j.failed.length ? ('\n\nFailed (safe to re-run this page to retry):\n' + j.failed.join('\n')) : '');
    })
    .catch(() => {
      document.getElementById('status').textContent = 'Network hiccup — reload the page to retry.';
    });
}
</script>
</body>
</html>
