  <!-- RETIRED. This used to rewrite every existing lesson's Let's Talk
       (discussion) / Let's Practise (practise) questions into multiple
       choice. That's no longer what the app wants — Let's Talk is meant
       to stay open-ended, free discussion (see api/generate.js's and
       api/make.js's discussion prompt, and public/lesson.html's
       talkQuestionHtml() doc-comment). The backing endpoint
       (api/make.js's upgradeDiscussionOne()) now just returns a 410 and
       does nothing, so this page no longer calls it at all. Comprehension's
       equivalent tool, upgrade-comprehension.html, is UNCHANGED and still
       works — comprehension is still meant to be multiple-choice. -->
  <div class="twrap">
    <h1>🚫 Retired</h1>
    <p style="color:var(--muted)">This tool used to convert Let's Talk / Let's Practise questions into multiple choice. Let's Talk is meant to stay open, free discussion now, so this tool has been retired and no longer does anything.</p>
  </div>
